name: Deploy JobPilot to production VPS
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobpilot-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build, test, back up and deploy the exact main revision
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          for attempt in 1 2 3 4 5 6; do
            status=0
            ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 jobpilot-deploy@141.95.18.14 "$REVISION" || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            echo 'Production is busy; retrying in one minute.'
            sleep 60
          done
          exit 75
